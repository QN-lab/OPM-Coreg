[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opm-coreg"
version = "2.0.2"
description = "OPM-Coreg - A GUI application for co-registering OPM sensors and auxiliary devices to anatomical MRI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Kiran Phalke"},
    {name = "Harry Cook"},
    {name = "Andrew Quinn"},
    {name = "Giovanni Barontini"},
    {name = "Anna Kowalczyk"},
]
keywords = [
    "opm",
    "meg",
    "neuroimaging",
    "coregistration",
    "mri",
]
license = {file = "LICENSE"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "pandas",
    "PyQt5",
    "vtk",
    "mne",
    "pyvista",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
opm-coreg = "opm_coreg.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opm_coreg = ["**/*.py"]
