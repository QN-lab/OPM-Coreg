[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opm-coreg-gui"
version = "2.0.0"
description = "OPM Coregistration GUI - A GUI application for co-registering OPM sensors and auxiliary devices to anatomical MRI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Anna Kowalczyk"},
    {name = "Kiran Phalke"},
]
keywords = ["opm", "coregistration", "gui", "neuroimaging"]

dependencies = [
    "numpy",
    "pandas",
    "PyQt5",
    "vtk",
    "mne",
    "pyvista",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
opm-coreg-gui = "opm_coreg_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opm_coreg_gui = ["**/*.py"]
